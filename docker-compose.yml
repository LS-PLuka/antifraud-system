services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: antifraude
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

servico-transacao:
  build:
    context: https://github.com/LS-PLuka/servico-transacao.git
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/antifraude
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRACAO: ${JWT_EXPIRACAO:-86400000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@antifraude.com}
      ADMIN_SENHA: ${ADMIN_SENHA:-admin123456}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

